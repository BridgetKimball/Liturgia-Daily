<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <title>Liturgia Daily | Daily Reading</title>
    <meta
      name="description"
      content="Liturgia Daily: daily readings and Gospel themed to today's liturgical season and color."
    >
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <button id="nav-toggle" class="top-logo-button" type="button" aria-label="Open navigation menu" aria-controls="side-nav" aria-expanded="false">
      <img class="top-logo-icon" src="Images/Liturgia_Daily_Logo.png" alt="">
    </button>
    <div id="nav-overlay" class="side-nav-overlay" aria-hidden="true"></div>
    <nav id="side-nav" class="side-nav-panel" aria-label="Site navigation">
      <h2 class="side-nav-title">Navigate</h2>
      <ul class="side-nav-list">
        <li><a class="side-nav-link" href="index.html">Home</a></li>
        <li><a class="side-nav-link" href="daily-prayer.html">Daily Prayer</a></li>
        <li><a class="side-nav-link" href="daily-reading.html">Daily Reading</a></li>
      </ul>
    </nav>

    <main class="page-shell">
      <header class="brand fade-in-up delay-1">
        <p class="brand-kicker">LITURGIA DAILY</p>
        <div class="brand-rule" aria-hidden="true"></div>
      </header>

      <section class="hero fade-in-up delay-2" aria-label="Daily readings heading">
        <img class="app-icon" src="Images/Liturgia_Daily_Logo.png" alt="Liturgia Daily Logo">
        <h1>Daily Reading</h1>
        <h2 id="reading-note">Word of the Day</h2>
        <p id="date-text" class="date"></p>
      </section>

      <section class="reflection fade-in-up delay-3" aria-label="Reading of the day">
        <h3 class="reading-heading">Reading of the Day</h3>
        <p id="reading-text" class="reading-body">Loading reading...</p>
      </section>

      <section class="reflection fade-in-up delay-4" aria-label="Gospel of the day">
        <h3 class="reading-heading">Gospel of the Day</h3>
        <p id="gospel-text" class="reading-body">Loading Gospel...</p>
      </section>

      <section class="reflection fade-in-up delay-5" aria-label="Words of the Popes">
        <h3 class="reading-heading">Words of the Popes</h3>
        <p id="pope-text" class="reading-body">Loading reflection...</p>
      </section>

      <section class="page-actions fade-in-up delay-5" aria-label="Reading resources">
        <a class="liturgia-button" href="https://www.vaticannews.va/en/word-of-the-day.html" target="_blank" rel="noopener noreferrer">Open Vatican Word of the Day</a>
      </section>
    </main>

    <script>
      function initSideNav() {
        const toggle = document.getElementById('nav-toggle');
        const overlay = document.getElementById('nav-overlay');
        const navLinks = document.querySelectorAll('.side-nav-link');

        function setNavState(open) {
          document.body.classList.toggle('nav-open', open);
          toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
          overlay.setAttribute('aria-hidden', open ? 'false' : 'true');
        }

        toggle.addEventListener('click', () => {
          setNavState(!document.body.classList.contains('nav-open'));
        });

        overlay.addEventListener('click', () => setNavState(false));
        navLinks.forEach((link) => link.addEventListener('click', () => setNavState(false)));

        document.addEventListener('keydown', (event) => {
          if (event.key === 'Escape') {
            setNavState(false);
          }
        });
      }

      initSideNav();

      const MONTH_NAMES = [
        'January', 'February', 'March', 'April', 'May', 'June',
        'July', 'August', 'September', 'October', 'November', 'December',
      ];
      const DAY_NAMES = [
        'Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday',
      ];

      function toDateOnly(date) {
        return new Date(date.getFullYear(), date.getMonth(), date.getDate());
      }

      function addDays(date, days) {
        const result = new Date(date);
        result.setDate(result.getDate() + days);
        return result;
      }

      function isSameDay(a, b) {
        return (
          a.getFullYear() === b.getFullYear() &&
          a.getMonth() === b.getMonth() &&
          a.getDate() === b.getDate()
        );
      }

      function getEasterDate(year) {
        const a = year % 19;
        const b = Math.floor(year / 100);
        const c = year % 100;
        const d = Math.floor(b / 4);
        const e = b % 4;
        const f = Math.floor((b + 8) / 25);
        const g = Math.floor((b - f + 1) / 3);
        const h = (19 * a + b - d - g + 15) % 30;
        const i = Math.floor(c / 4);
        const k = c % 4;
        const l = (32 + 2 * e + 2 * i - h - k) % 7;
        const m = Math.floor((a + 11 * h + 22 * l) / 451);
        const month = Math.floor((h + l - 7 * m + 114) / 31) - 1;
        const day = ((h + l - 7 * m + 114) % 31) + 1;
        return new Date(year, month, day);
      }

      function getAdventStart(year) {
        const nov27 = new Date(year, 10, 27);
        const dayOfWeek = nov27.getDay();
        const daysToNextSunday = dayOfWeek === 0 ? 0 : 7 - dayOfWeek;
        return new Date(year, 10, 27 + daysToNextSunday);
      }

      function getBaptismOfLord(year) {
        const epiphany = new Date(year, 0, 6);
        const epiphanyDay = epiphany.getDay();
        if (epiphanyDay === 0) {
          return new Date(year, 0, 13);
        }
        return new Date(year, 0, 6 + (7 - epiphanyDay));
      }

      function getLiturgicalInfo(date) {
        const d = toDateOnly(date || new Date());
        const year = d.getFullYear();

        const easter = getEasterDate(year);
        const ashWednesday = addDays(easter, -46);
        const pentecost = addDays(easter, 49);
        const adventStart = getAdventStart(year);
        const baptismOfLord = getBaptismOfLord(year);
        const christmas = new Date(year, 11, 25);

        const laetareSunday = addDays(easter, -21);
        const palmSunday = addDays(easter, -7);
        const holyThursday = addDays(easter, -3);
        const goodFriday = addDays(easter, -2);
        const holySaturday = addDays(easter, -1);

        const gaudeteSunday = addDays(adventStart, 14);

        if (d <= baptismOfLord) {
          return {
            season: 'Christmastide',
            note: isSameDay(d, new Date(year, 0, 6)) ? 'Feast of Epiphany' : '',
            color: 'White',
            colorHex: '#FFFFFF',
            darkColorHex: '#C8A951',
          };
        }

        if (d < ashWednesday) {
          return {
            season: 'Ordinary Time',
            note: '',
            color: 'Green',
            colorHex: '#2D7D46',
            darkColorHex: '#1A4D2B',
          };
        }

        if (d < easter) {
          if (isSameDay(d, laetareSunday)) {
            return {
              season: 'Lent',
              note: 'Laetare Sunday',
              color: 'Rose',
              colorHex: '#C87697',
              darkColorHex: '#8B4C66',
            };
          }
          if (isSameDay(d, palmSunday)) {
            return {
              season: 'Holy Week',
              note: 'Palm Sunday',
              color: 'Red',
              colorHex: '#C0392B',
              darkColorHex: '#7D1A14',
            };
          }
          if (isSameDay(d, holyThursday)) {
            return {
              season: 'Holy Week',
              note: 'Holy Thursday',
              color: 'White',
              colorHex: '#FFFFFF',
              darkColorHex: '#C8A951',
            };
          }
          if (isSameDay(d, goodFriday)) {
            return {
              season: 'Holy Week',
              note: 'Good Friday',
              color: 'Red',
              colorHex: '#C0392B',
              darkColorHex: '#7D1A14',
            };
          }
          if (isSameDay(d, holySaturday)) {
            return {
              season: 'Holy Week',
              note: 'Holy Saturday',
              color: 'White',
              colorHex: '#FFFFFF',
              darkColorHex: '#C8A951',
            };
          }
          return {
            season: 'Lent',
            note: '',
            color: 'Purple',
            colorHex: '#6B3FA0',
            darkColorHex: '#3E1C6E',
          };
        }

        if (d <= pentecost) {
          if (isSameDay(d, pentecost)) {
            return {
              season: 'Pentecost',
              note: 'Pentecost Sunday',
              color: 'Red',
              colorHex: '#C0392B',
              darkColorHex: '#7D1A14',
            };
          }
          return {
            season: 'Eastertide',
            note: isSameDay(d, easter) ? 'Easter Sunday' : '',
            color: 'White',
            colorHex: '#FFFFFF',
            darkColorHex: '#C8A951',
          };
        }

        if (d < adventStart) {
          return {
            season: 'Ordinary Time',
            note: '',
            color: 'Green',
            colorHex: '#2D7D46',
            darkColorHex: '#1A4D2B',
          };
        }

        if (d < christmas) {
          if (isSameDay(d, gaudeteSunday)) {
            return {
              season: 'Advent',
              note: 'Gaudete Sunday',
              color: 'Rose',
              colorHex: '#C87697',
              darkColorHex: '#8B4C66',
            };
          }
          return {
            season: 'Advent',
            note: '',
            color: 'Purple',
            colorHex: '#6B3FA0',
            darkColorHex: '#3E1C6E',
          };
        }

        return {
          season: 'Christmastide',
          note: isSameDay(d, christmas) ? 'Christmas Day' : '',
          color: 'White',
          colorHex: '#FFFFFF',
          darkColorHex: '#C8A951',
        };
      }

      function getOrdinal(n) {
        const s = ['th', 'st', 'nd', 'rd'];
        const v = n % 100;
        return n + (s[(v - 20) % 10] || s[v] || s[0]);
      }

      function formatDate(date) {
        const d = date.getDate();
        const month = MONTH_NAMES[date.getMonth()];
        const year = date.getFullYear();
        const weekday = DAY_NAMES[date.getDay()];
        return weekday + ', ' + month + ' ' + getOrdinal(d) + ', ' + year;
      }

      function applyLiturgicalTheme() {
        const today = new Date();
        const info = getLiturgicalInfo(today);
        const root = document.documentElement;
        const dateText = document.getElementById('date-text');
        const readingNote = document.getElementById('reading-note');

        root.style.setProperty('--liturgical-color', info.colorHex);
        root.style.setProperty('--liturgical-color-dark', info.darkColorHex);
        dateText.textContent = formatDate(today);

        const noteSuffix = info.note ? ' - ' + info.note : '';
        readingNote.textContent = info.season + noteSuffix;

        if (info.color === 'White') {
          document.body.classList.add('easter-white-theme');
        }
      }

      function normalizeSection(text) {
        if (!text) {
          return '';
        }

        return text
          .replace(/\r/g, '')
          .replace(/^\s+/gm, '')
          .replace(/\n{3,}/g, '\n\n')
          .trim();
      }

      function escapeRegExp(text) {
        return text.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      }

      function extractSection(markdown, heading) {
        const sectionRegex = new RegExp(
          '\\n##\\s+' + escapeRegExp(heading) + '\\s*\\n([\\s\\S]*?)(?=\\n##\\s+|$)',
          'i'
        );
        const match = markdown.match(sectionRegex);
        return match ? normalizeSection(match[1]) : '';
      }

      function parseWordOfDay(markdown) {
        const dateMatch = markdown.match(/Date\s+(\d{2}\/\d{2}\/\d{4})/i);
        const liturgicalDayMatch = markdown.match(/Date\s+\d{2}\/\d{2}\/\d{4}\s*\n\s*\n([^\n]+)/i);

        const reading = extractSection(markdown, 'Reading of the day');
        const gospel = extractSection(markdown, 'Gospel of the day');
        const pope = extractSection(markdown, 'The words of the popes');

        return {
          sourceDate: dateMatch ? dateMatch[1] : '',
          liturgicalDay: liturgicalDayMatch ? liturgicalDayMatch[1].trim() : '',
          reading,
          gospel,
          pope,
        };
      }

      function getDateBasedWordOfDayPrintUrl() {
        const now = new Date();
        const year = String(now.getFullYear());
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        return 'https://r.jina.ai/http://www.vaticannews.va/en/word-of-the-day/' + year + '/' + month + '/' + day + '.print.html';
      }

      async function loadDailyReadings() {
        const readingEl = document.getElementById('reading-text');
        const gospelEl = document.getElementById('gospel-text');
        const popeEl = document.getElementById('pope-text');
        const readingNote = document.getElementById('reading-note');

        const fallback = {
          reading: 'Daily readings are temporarily unavailable. Tap the button below to open Vatican Word of the Day directly.',
          gospel: 'Please use the Vatican source page for the complete Gospel text and references for today.',
          pope: 'A daily papal reflection is available on the Vatican Word of the Day page.',
        };

        try {
          const response = await fetch(getDateBasedWordOfDayPrintUrl(), {
            cache: 'no-store',
          });

          let markdown = '';
          if (response.ok) {
            markdown = await response.text();
          }

          if (!markdown || !/##\s+Reading of the day/i.test(markdown)) {
            const fallbackResponse = await fetch('https://r.jina.ai/http://www.vaticannews.va/en/word-of-the-day.html', {
              cache: 'no-store',
            });

            if (!fallbackResponse.ok) {
              throw new Error('Failed to fetch reading source.');
            }

            markdown = await fallbackResponse.text();
          }

          const parsed = parseWordOfDay(markdown);

          readingEl.textContent = parsed.reading || fallback.reading;
          gospelEl.textContent = parsed.gospel || fallback.gospel;
          popeEl.textContent = parsed.pope || fallback.pope;

          if (parsed.liturgicalDay) {
            readingNote.textContent = parsed.liturgicalDay;
          }
        } catch (error) {
          readingEl.textContent = fallback.reading;
          gospelEl.textContent = fallback.gospel;
          popeEl.textContent = fallback.pope;
        }
      }

      applyLiturgicalTheme();
      loadDailyReadings();
    </script>
  </body>
</html>
