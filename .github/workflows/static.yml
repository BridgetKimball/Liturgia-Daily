# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Prepare site
        run: |
          mkdir -p _site/src/html _site/src/scripts
          cp index.html _site/
          cp -R Images _site/
          cp -R "Liturgical Calendars" _site/
          cp src/html/daily-prayer.html _site/src/html/
          cp src/html/daily-reading.html _site/src/html/
          cp src/scripts/nav.js _site/src/scripts/
          cp src/scripts/liturgical-core.js _site/src/scripts/
          cp src/scripts/home-page.js _site/src/scripts/
          cp src/scripts/daily-prayer-page.js _site/src/scripts/
          cp src/scripts/daily-reading-page.js _site/src/scripts/
          cp src/styles.css _site/src/
          find _site -name .DS_Store -delete
          touch _site/.nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'
          include-hidden-files: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
