<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <title>Liturgia Daily</title>
    <meta
      name="description"
      content="Liturgia Daily: daily liturgical color, observance, and reflection."
    >
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="src/styles.css">
  </head>
  <body class="home-page">
    <button id="nav-toggle" class="top-logo-button" type="button" aria-label="Open navigation menu" aria-controls="side-nav" aria-expanded="false">
      <img class="top-logo-icon" src="Images/Liturgia_Daily_Logo.png" alt="">
    </button>
    <div id="nav-overlay" class="side-nav-overlay" aria-hidden="true"></div>
    <nav id="side-nav" class="side-nav-panel" aria-label="Site navigation">
      <h2 class="side-nav-title">Navigate</h2>
      <ul class="side-nav-list">
        <li><a class="side-nav-link" href="index.html">Home</a></li>
        <li><a class="side-nav-link" href="src/html/daily-prayer.html">Daily Prayer</a></li>
        <li><a class="side-nav-link" href="src/html/daily-reading.html">Daily Reading</a></li>
      </ul>
    </nav>

    <main class="page-shell">
      <header class="brand fade-in-up delay-1">
        <p class="brand-kicker">LITURGIA DAILY</p>
        <div class="brand-rule" aria-hidden="true"></div>
        <p id="date-text" class="date"></p>
      </header>

      <section class="hero fade-in-up delay-2" aria-label="Daily liturgical summary">
        <div class="hero-primary">
          <img class="app-icon" data-color="White" src="Images/Liturgia_Daily_Logo.png" alt="Liturgia Daily Logo">
          <h1 id="season-label">Loading...</h1>
          <h2 id="note-label">Liturgical Note</h2>
        </div>
        <p id="season-end" class="season-end">Season ends: Loading...</p>
        <p id="saint-feast" class="saint-feast" hidden></p>
        <p class="color-line">
          <span id="color-dot" class="color-dot" aria-hidden="true"></span>
          <span id="color-text">Loading...</span>
        </p>
      </section>

      <section class="reflection fade-in-up delay-3" aria-label="Daily reflection">
        <p id="description-text"></p>
      </section>

      <section class="page-actions fade-in-up delay-4" aria-label="Page actions">
        <div class="button-row">
          <a class="liturgia-button" href="src/html/daily-prayer.html">Open Daily Prayer</a>
          <a class="liturgia-button" href="src/html/daily-reading.html">Open Daily Reading</a>
        </div>
      </section>

      <section class="widget-area fade-in-up delay-5" aria-label="Widget preview">
        <article class="widget-card">
          <img class="widget-icon" src="Images/Liturgia_Daily_Logo.png" alt="Liturgia Daily Logo">
          <p class="widget-brand">LITURGIA</p>
          <h3 id="widget-season">Loading...</h3>
          <p id="widget-color" class="widget-color">Loading...</p>
        </article>
      </section>
    </main>
    <script src="src/scripts/nav.js"></script>
    <script src="src/scripts/liturgical-core.js"></script>
    <script src="src/scripts/home-page.js"></script>
  </body>
</html>
