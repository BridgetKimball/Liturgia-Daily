<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liturgia Daily</title>
    <meta
      name="description"
      content="Liturgia Daily: daily liturgical color, observance, and reflection."
    >
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="page-shell">
      <header class="brand fade-in-up delay-1">
        <p class="brand-kicker">LITURGIA DAILY</p>
        <div class="brand-rule" aria-hidden="true"></div>
      </header>

      <section class="hero fade-in-up delay-2" aria-label="Daily liturgical summary">
        <div class="app-icon" aria-hidden="true">✝</div>
        <h1>Holy Week</h1>
        <h2>Holy Saturday</h2>
        <p class="color-line">
          <span class="color-dot" aria-hidden="true"></span>
          White
        </p>
        <p class="date">Saturday, April 4, 2026</p>
      </section>

      <section class="reflection fade-in-up delay-3" aria-label="Daily reflection">
        <p>
          The Church awaits in silent prayer as Christ lies in the tomb. The Easter
          Vigil begins tonight.
        </p>
      </section>

      <section class="widget-area fade-in-up delay-4" aria-label="Widget preview">
        <article class="widget-card">
          <p class="widget-icon" aria-hidden="true">✝</p>
          <p class="widget-brand">LITURGIA</p>
          <h3>Holy Saturday</h3>
          <p class="widget-color">White</p>
        </article>
      </section>
    </main>
  </body>
</html>
