<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liturgia Daily</title>
    <meta
      name="description"
      content="Liturgia Daily: daily liturgical color, observance, and reflection."
    >
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="page-shell">
      <header class="brand fade-in-up delay-1">
        <p class="brand-kicker">LITURGIA DAILY</p>
        <div class="brand-rule" aria-hidden="true"></div>
      </header>

      <section class="hero fade-in-up delay-2" aria-label="Daily liturgical summary">
        <img class="app-icon" data-color="White" src="Images/Liturgia_Daily_Logo.png" alt="Liturgia Daily Logo">
        <h1 id="season-label">Loading...</h1>
        <h2 id="note-label">Liturgical Note</h2>
        <p class="color-line">
          <span id="color-dot" class="color-dot" aria-hidden="true"></span>
          <span id="color-text">Loading...</span>
        </p>
        <p id="date-text" class="date"></p>
      </section>

      <section class="reflection fade-in-up delay-3" aria-label="Daily reflection">
        <p id="description-text"></p>
      </section>

      <section class="widget-area fade-in-up delay-4" aria-label="Widget preview">
        <article class="widget-card">
          <img class="widget-icon" src="Images/Liturgia_Daily_Logo.png" alt="Liturgia Daily Logo">
          <p class="widget-brand">LITURGIA</p>
          <h3 id="widget-season">Loading...</h3>
          <p id="widget-color" class="widget-color">Loading...</p>
        </article>
      </section>
    </main>
    <script>
      const MONTH_NAMES = [
        'January', 'February', 'March', 'April', 'May', 'June',
        'July', 'August', 'September', 'October', 'November', 'December',
      ];
      const DAY_NAMES = [
        'Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday',
      ];

      function toDateOnly(date) {
        return new Date(date.getFullYear(), date.getMonth(), date.getDate());
      }

      function addDays(date, days) {
        const result = new Date(date);
        result.setDate(result.getDate() + days);
        return result;
      }

      function isSameDay(a, b) {
        return (
          a.getFullYear() === b.getFullYear() &&
          a.getMonth() === b.getMonth() &&
          a.getDate() === b.getDate()
        );
      }

      function getEasterDate(year) {
        const a = year % 19;
        const b = Math.floor(year / 100);
        const c = year % 100;
        const d = Math.floor(b / 4);
        const e = b % 4;
        const f = Math.floor((b + 8) / 25);
        const g = Math.floor((b - f + 1) / 3);
        const h = (19 * a + b - d - g + 15) % 30;
        const i = Math.floor(c / 4);
        const k = c % 4;
        const l = (32 + 2 * e + 2 * i - h - k) % 7;
        const m = Math.floor((a + 11 * h + 22 * l) / 451);
        const month = Math.floor((h + l - 7 * m + 114) / 31) - 1;
        const day = ((h + l - 7 * m + 114) % 31) + 1;
        return new Date(year, month, day);
      }

      function getAdventStart(year) {
        const nov27 = new Date(year, 10, 27);
        const dayOfWeek = nov27.getDay();
        const daysToNextSunday = dayOfWeek === 0 ? 0 : 7 - dayOfWeek;
        return new Date(year, 10, 27 + daysToNextSunday);
      }

      function getBaptismOfLord(year) {
        const epiphany = new Date(year, 0, 6);
        const epiphanyDay = epiphany.getDay();
        if (epiphanyDay === 0) {
          return new Date(year, 0, 13);
        }
        return new Date(year, 0, 6 + (7 - epiphanyDay));
      }

      function getLiturgicalInfo(date) {
        const d = toDateOnly(date || new Date());
        const year = d.getFullYear();

        const easter = getEasterDate(year);
        const ashWednesday = addDays(easter, -46);
        const pentecost = addDays(easter, 49);
        const adventStart = getAdventStart(year);
        const baptismOfLord = getBaptismOfLord(year);
        const christmas = new Date(year, 11, 25);

        const laetareSunday = addDays(easter, -21);
        const palmSunday = addDays(easter, -7);
        const holyThursday = addDays(easter, -3);
        const goodFriday = addDays(easter, -2);
        const holySaturday = addDays(easter, -1);

        const gaudeteSunday = addDays(adventStart, 14);

        if (d <= baptismOfLord) {
          return {
            season: 'Christmastide',
            note: isSameDay(d, new Date(year, 0, 6)) ? 'Feast of Epiphany' : '',
            color: 'White',
            colorHex: '#F5EFD5',
            darkColorHex: '#C8A951',
            description: 'Celebrating the Nativity of Our Lord Jesus Christ and the revelation of God made flesh.',
          };
        }

        if (d < ashWednesday) {
          return {
            season: 'Ordinary Time',
            note: '',
            color: 'Green',
            colorHex: '#2D7D46',
            darkColorHex: '#1A4D2B',
            description: 'A season of growth in faith, walking with Christ through His public ministry.',
          };
        }

        if (d < easter) {
          if (isSameDay(d, laetareSunday)) {
            return {
              season: 'Lent',
              note: 'Laetare Sunday',
              color: 'Rose',
              colorHex: '#C87697',
              darkColorHex: '#8B4C66',
              description: 'A day of joy in the midst of Lent - "Laetare" means "Rejoice!"',
            };
          }
          if (isSameDay(d, palmSunday)) {
            return {
              season: 'Holy Week',
              note: 'Palm Sunday',
              color: 'Red',
              colorHex: '#C0392B',
              darkColorHex: '#7D1A14',
              description: 'Jesus enters Jerusalem in triumph as the crowd waves palm branches.',
            };
          }
          if (isSameDay(d, holyThursday)) {
            return {
              season: 'Holy Week',
              note: 'Holy Thursday',
              color: 'White',
              colorHex: '#F5EFD5',
              darkColorHex: '#C8A951',
              description: "The Mass of the Lord's Supper - the institution of the Eucharist and holy priesthood.",
            };
          }
          if (isSameDay(d, goodFriday)) {
            return {
              season: 'Holy Week',
              note: 'Good Friday',
              color: 'Red',
              colorHex: '#C0392B',
              darkColorHex: '#7D1A14',
              description: 'The Passion of Our Lord - we commemorate the crucifixion and death of Jesus Christ.',
            };
          }
          if (isSameDay(d, holySaturday)) {
            return {
              season: 'Holy Week',
              note: 'Holy Saturday',
              color: 'White',
              colorHex: '#F5EFD5',
              darkColorHex: '#C8A951',
              description: 'The Church awaits in silent prayer as Christ lies in the tomb. The Easter Vigil begins tonight.',
            };
          }
          return {
            season: 'Lent',
            note: '',
            color: 'Purple',
            colorHex: '#6B3FA0',
            darkColorHex: '#3E1C6E',
            description: 'A season of penance, prayer, and fasting in preparation for Easter.',
          };
        }

        if (d <= pentecost) {
          if (isSameDay(d, pentecost)) {
            return {
              season: 'Pentecost',
              note: 'Pentecost Sunday',
              color: 'Red',
              colorHex: '#C0392B',
              darkColorHex: '#7D1A14',
              description: 'The descent of the Holy Spirit upon the Apostles - the birthday of the Church.',
            };
          }
          return {
            season: 'Eastertide',
            note: isSameDay(d, easter) ? 'Easter Sunday' : '',
            color: 'White',
            colorHex: '#F5EFD5',
            darkColorHex: '#C8A951',
            description: 'Alleluia! We celebrate the Resurrection of Our Lord Jesus Christ for fifty joyful days.',
          };
        }

        if (d < adventStart) {
          return {
            season: 'Ordinary Time',
            note: '',
            color: 'Green',
            colorHex: '#2D7D46',
            darkColorHex: '#1A4D2B',
            description: 'A season of growth in faith, walking with Christ through His public ministry.',
          };
        }

        if (d < christmas) {
          if (isSameDay(d, gaudeteSunday)) {
            return {
              season: 'Advent',
              note: 'Gaudete Sunday',
              color: 'Rose',
              colorHex: '#C87697',
              darkColorHex: '#8B4C66',
              description: 'A day of joy in Advent - "Gaudete" means "Rejoice!" - as Christmas draws near.',
            };
          }
          return {
            season: 'Advent',
            note: '',
            color: 'Purple',
            colorHex: '#6B3FA0',
            darkColorHex: '#3E1C6E',
            description: 'A time of joyful preparation and expectant waiting for the coming of Our Lord.',
          };
        }

        return {
          season: 'Christmastide',
          note: isSameDay(d, christmas) ? 'Christmas Day' : '',
          color: 'White',
          colorHex: '#F5EFD5',
          darkColorHex: '#C8A951',
          description: 'Celebrating the Nativity of Our Lord Jesus Christ and the revelation of God made flesh.',
        };
      }

      function formatDate(d) {
        return `${DAY_NAMES[d.getDay()]}, ${MONTH_NAMES[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
      }

      const today = new Date();
      const info = getLiturgicalInfo(today);

      document.getElementById('season-label').textContent = info.season;
      document.getElementById('widget-season').textContent = info.season;
      document.getElementById('color-text').textContent = info.color;
      document.getElementById('widget-color').textContent = info.color;
      document.getElementById('date-text').textContent = formatDate(today);
      document.getElementById('description-text').textContent = info.description;

      const noteEl = document.getElementById('note-label');
      if (info.note) {
        noteEl.textContent = info.note;
      } else {
        noteEl.style.display = 'none';
      }

      const appIcon = document.querySelector('.app-icon');
      if (appIcon) {
        appIcon.style.backgroundColor = info.darkColorHex;
      }

      const colorDot = document.getElementById('color-dot');
      if (colorDot) {
        colorDot.style.backgroundColor = info.colorHex;
      }

      document.documentElement.style.setProperty('--current-color', info.colorHex);
      document.documentElement.style.setProperty('--current-dark-color', info.darkColorHex);
      document.documentElement.style.setProperty('--current-dot-border', info.darkColorHex);
    </script>
  </body>
</html>
