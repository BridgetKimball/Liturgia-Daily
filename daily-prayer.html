<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <title>Liturgia Daily | Daily Prayer</title>
    <meta
      name="description"
      content="Liturgia Daily: a daily prayer page that follows today's liturgical season and color."
    >
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <button id="nav-toggle" class="top-logo-button" type="button" aria-label="Open navigation menu" aria-controls="side-nav" aria-expanded="false">
      <img class="top-logo-icon" src="Images/Liturgia_Daily_Logo.png" alt="">
    </button>
    <div id="nav-overlay" class="side-nav-overlay" aria-hidden="true"></div>
    <nav id="side-nav" class="side-nav-panel" aria-label="Site navigation">
      <h2 class="side-nav-title">Navigate</h2>
      <ul class="side-nav-list">
        <li><a class="side-nav-link" href="index.html">Home</a></li>
        <li><a class="side-nav-link" href="daily-prayer.html">Daily Prayer</a></li>
      </ul>
    </nav>

    <main class="page-shell">
      <header class="brand fade-in-up delay-1">
        <p class="brand-kicker">LITURGIA DAILY</p>
        <div class="brand-rule" aria-hidden="true"></div>
      </header>

      <section class="hero fade-in-up delay-2" aria-label="Daily prayer heading">
        <img class="app-icon" src="Images/Liturgia_Daily_Logo.png" alt="Liturgia Daily Logo">
        <h1>Daily Prayer</h1>
        <h2 id="prayer-note">For Today</h2>
        <p class="color-line">
          <span id="color-dot" class="color-dot" aria-hidden="true"></span>
          <span id="color-text">Loading...</span>
        </p>
        <p id="date-text" class="date"></p>
      </section>

      <section class="reflection fade-in-up delay-3" aria-label="Prayer of the day">
        <p id="prayer-text"></p>
      </section>

      <section class="reflection fade-in-up delay-4" aria-label="Prayer intention">
        <p id="intention-text"></p>
      </section>

      <section class="page-actions fade-in-up delay-5" aria-label="Prayer resources">
        <a class="liturgia-button" href="https://www.heartofthenation.org/prayer-resources/todays-prayer-for-you" target="_blank" rel="noopener noreferrer">Open Today's Prayer Resource</a>
      </section>
    </main>

    <script>
      function initSideNav() {
        const toggle = document.getElementById('nav-toggle');
        const overlay = document.getElementById('nav-overlay');
        const navLinks = document.querySelectorAll('.side-nav-link');

        function setNavState(open) {
          document.body.classList.toggle('nav-open', open);
          toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
          overlay.setAttribute('aria-hidden', open ? 'false' : 'true');
        }

        toggle.addEventListener('click', () => {
          setNavState(!document.body.classList.contains('nav-open'));
        });

        overlay.addEventListener('click', () => setNavState(false));
        navLinks.forEach((link) => link.addEventListener('click', () => setNavState(false)));

        document.addEventListener('keydown', (event) => {
          if (event.key === 'Escape') {
            setNavState(false);
          }
        });
      }

      initSideNav();

      const MONTH_NAMES = [
        'January', 'February', 'March', 'April', 'May', 'June',
        'July', 'August', 'September', 'October', 'November', 'December',
      ];
      const DAY_NAMES = [
        'Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday',
      ];

      function toDateOnly(date) {
        return new Date(date.getFullYear(), date.getMonth(), date.getDate());
      }

      function addDays(date, days) {
        const result = new Date(date);
        result.setDate(result.getDate() + days);
        return result;
      }

      function isSameDay(a, b) {
        return (
          a.getFullYear() === b.getFullYear() &&
          a.getMonth() === b.getMonth() &&
          a.getDate() === b.getDate()
        );
      }

      function getEasterDate(year) {
        const a = year % 19;
        const b = Math.floor(year / 100);
        const c = year % 100;
        const d = Math.floor(b / 4);
        const e = b % 4;
        const f = Math.floor((b + 8) / 25);
        const g = Math.floor((b - f + 1) / 3);
        const h = (19 * a + b - d - g + 15) % 30;
        const i = Math.floor(c / 4);
        const k = c % 4;
        const l = (32 + 2 * e + 2 * i - h - k) % 7;
        const m = Math.floor((a + 11 * h + 22 * l) / 451);
        const month = Math.floor((h + l - 7 * m + 114) / 31) - 1;
        const day = ((h + l - 7 * m + 114) % 31) + 1;
        return new Date(year, month, day);
      }

      function getAdventStart(year) {
        const nov27 = new Date(year, 10, 27);
        const dayOfWeek = nov27.getDay();
        const daysToNextSunday = dayOfWeek === 0 ? 0 : 7 - dayOfWeek;
        return new Date(year, 10, 27 + daysToNextSunday);
      }

      function getBaptismOfLord(year) {
        const epiphany = new Date(year, 0, 6);
        const epiphanyDay = epiphany.getDay();
        if (epiphanyDay === 0) {
          return new Date(year, 0, 13);
        }
        return new Date(year, 0, 6 + (7 - epiphanyDay));
      }

      function getLiturgicalInfo(date) {
        const d = toDateOnly(date || new Date());
        const year = d.getFullYear();

        const easter = getEasterDate(year);
        const ashWednesday = addDays(easter, -46);
        const pentecost = addDays(easter, 49);
        const adventStart = getAdventStart(year);
        const baptismOfLord = getBaptismOfLord(year);
        const christmas = new Date(year, 11, 25);

        const laetareSunday = addDays(easter, -21);
        const palmSunday = addDays(easter, -7);
        const holyThursday = addDays(easter, -3);
        const goodFriday = addDays(easter, -2);
        const holySaturday = addDays(easter, -1);

        const gaudeteSunday = addDays(adventStart, 14);

        if (d <= baptismOfLord) {
          return {
            season: 'Christmastide',
            note: isSameDay(d, new Date(year, 0, 6)) ? 'Feast of Epiphany' : '',
            color: 'White',
            colorHex: '#FFFFFF',
            darkColorHex: '#C8A951',
          };
        }

        if (d < ashWednesday) {
          return {
            season: 'Ordinary Time',
            note: '',
            color: 'Green',
            colorHex: '#2D7D46',
            darkColorHex: '#1A4D2B',
          };
        }

        if (d < easter) {
          if (isSameDay(d, laetareSunday)) {
            return {
              season: 'Lent',
              note: 'Laetare Sunday',
              color: 'Rose',
              colorHex: '#C87697',
              darkColorHex: '#8B4C66',
            };
          }
          if (isSameDay(d, palmSunday)) {
            return {
              season: 'Holy Week',
              note: 'Palm Sunday',
              color: 'Red',
              colorHex: '#C0392B',
              darkColorHex: '#7D1A14',
            };
          }
          if (isSameDay(d, holyThursday)) {
            return {
              season: 'Holy Week',
              note: 'Holy Thursday',
              color: 'White',
              colorHex: '#FFFFFF',
              darkColorHex: '#C8A951',
            };
          }
          if (isSameDay(d, goodFriday)) {
            return {
              season: 'Holy Week',
              note: 'Good Friday',
              color: 'Red',
              colorHex: '#C0392B',
              darkColorHex: '#7D1A14',
            };
          }
          if (isSameDay(d, holySaturday)) {
            return {
              season: 'Holy Week',
              note: 'Holy Saturday',
              color: 'White',
              colorHex: '#FFFFFF',
              darkColorHex: '#C8A951',
            };
          }
          return {
            season: 'Lent',
            note: '',
            color: 'Purple',
            colorHex: '#6B3FA0',
            darkColorHex: '#3E1C6E',
          };
        }

        if (d <= pentecost) {
          if (isSameDay(d, pentecost)) {
            return {
              season: 'Pentecost',
              note: 'Pentecost Sunday',
              color: 'Red',
              colorHex: '#C0392B',
              darkColorHex: '#7D1A14',
            };
          }
          return {
            season: 'Eastertide',
            note: isSameDay(d, easter) ? 'Easter Sunday' : '',
            color: 'White',
            colorHex: '#FFFFFF',
            darkColorHex: '#C8A951',
          };
        }

        if (d < adventStart) {
          return {
            season: 'Ordinary Time',
            note: '',
            color: 'Green',
            colorHex: '#2D7D46',
            darkColorHex: '#1A4D2B',
          };
        }

        if (d < christmas) {
          if (isSameDay(d, gaudeteSunday)) {
            return {
              season: 'Advent',
              note: 'Gaudete Sunday',
              color: 'Rose',
              colorHex: '#C87697',
              darkColorHex: '#8B4C66',
            };
          }
          return {
            season: 'Advent',
            note: '',
            color: 'Purple',
            colorHex: '#6B3FA0',
            darkColorHex: '#3E1C6E',
          };
        }

        return {
          season: 'Christmastide',
          note: isSameDay(d, christmas) ? 'Christmas Day' : '',
          color: 'White',
          colorHex: '#FFFFFF',
          darkColorHex: '#C8A951',
        };
      }

      function formatDate(d) {
        return `${DAY_NAMES[d.getDay()]}, ${MONTH_NAMES[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
      }

      function getDailyPrayer(season) {
        const prayers = {
          Advent: 'Come, Lord Jesus. Prepare my heart to welcome You with hope, patience, and joyful trust.',
          Christmastide: 'Lord Jesus, Light of the world, let Your peace dwell in my home and guide my steps today.',
          OrdinaryTime: 'Lord, teach me to be faithful in ordinary moments, so every task becomes an act of love.',
          Lent: 'Merciful Father, grant me a repentant heart, deeper prayer, and strength to follow You in sacrifice.',
          HolyWeek: 'Jesus, in Your Passion teach me to remain near You in humility, gratitude, and steadfast love.',
          Eastertide: 'Risen Lord, fill me with Easter joy, renew my hope, and send me to share Your life with others.',
          Pentecost: 'Holy Spirit, kindle in me the fire of Your love so I may witness Christ with courage and charity.',
        };

        const seasonKey = season.replace(/\s+/g, '');
        return prayers[seasonKey] || prayers.OrdinaryTime;
      }

      function getIntention(color) {
        const intentions = {
          White: 'Intention: Pray for peace in hearts, homes, and communities.',
          Green: 'Intention: Pray for growth in faith and perseverance in daily holiness.',
          Purple: 'Intention: Pray for conversion, healing, and reconciliation.',
          Red: 'Intention: Pray for courage, sacrifice, and faithfulness under trial.',
          Rose: 'Intention: Pray for joy rooted in God\'s mercy and promises.',
        };

        return intentions[color] || 'Intention: Pray for the needs of the Church and the whole world.';
      }

      function extractPrayerFromMarkdown(markdown) {
        const headingMatch = markdown.match(/##\s+([^\n]*Prayer[^\n]*)\n/);
        const prayerBlockMatch = markdown.match(
          /##\s+[^\n]*Prayer[^\n]*\n\n([\s\S]*?)\n\n\[Read More Prayers for You\]/
        );

        if (!headingMatch || !prayerBlockMatch) {
          return null;
        }

        const heading = headingMatch[1].trim();
        const prayerText = prayerBlockMatch[1].replace(/\s+/g, ' ').trim();

        if (!prayerText) {
          return null;
        }

        return { heading, prayerText };
      }

      async function loadSourcePrayer() {
        const sourceUrl = 'https://r.jina.ai/http://www.heartofthenation.org/prayer-resources/todays-prayer-for-you';
        const response = await fetch(sourceUrl);
        if (!response.ok) {
          throw new Error(`Prayer source request failed: ${response.status}`);
        }

        const markdown = await response.text();
        const parsed = extractPrayerFromMarkdown(markdown);
        if (!parsed) {
          throw new Error('Unable to parse prayer text from source content.');
        }

        return parsed;
      }

      const today = new Date();
      const info = getLiturgicalInfo(today);

      if (info.season === 'Eastertide') {
        document.body.classList.add('easter-white-theme');
      }

      document.getElementById('color-text').textContent = info.color;
      document.getElementById('date-text').textContent = formatDate(today);
      document.getElementById('intention-text').textContent = getIntention(info.color);

      const prayerNote = document.getElementById('prayer-note');
      prayerNote.textContent = info.note ? `${info.season} - ${info.note}` : info.season;

      const prayerTextEl = document.getElementById('prayer-text');
      prayerTextEl.textContent = 'Loading today\'s prayer...';

      const appIcon = document.querySelector('.app-icon');
      if (appIcon) {
        appIcon.style.backgroundColor = info.darkColorHex;
      }

      const colorDot = document.getElementById('color-dot');
      if (colorDot) {
        colorDot.style.backgroundColor = info.colorHex;
      }

      document.documentElement.style.setProperty('--current-color', info.colorHex);
      document.documentElement.style.setProperty('--current-dark-color', info.darkColorHex);
      document.documentElement.style.setProperty('--current-dot-border', info.darkColorHex);

      loadSourcePrayer()
        .then(({ heading, prayerText }) => {
          prayerNote.textContent = heading;
          prayerTextEl.textContent = prayerText;
        })
        .catch(() => {
          prayerTextEl.textContent = getDailyPrayer(info.season);
        });
    </script>
  </body>
</html>
